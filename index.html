<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ececec">
  <meta name="referrer" content="no-referrer">
  <title>Commonplace</title>
  <meta name="description" content="A feed of things worth your attention. Ranked on your device.">
  <link rel="preload" href="fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-tone="paper">
    <header class="bar">
      <span class="mark">Commonplace</span>
      <nav aria-label="Library">
        <button type="button" id="btn-saved">Saved <span id="saved-count"></span></button>
        <button type="button" id="btn-interests">Interests</button>
      </nav>
    </header>
    <main class="feed" id="feed" tabindex="-1" aria-label="Feed"></main>
    <div class="dock" id="dock" role="group" aria-label="Card actions">
      <button type="button" data-act="save" aria-pressed="false">Save</button>
      <button type="button" data-act="sound" aria-label="Toggle sound" hidden>Sound</button>
      <button type="button" data-act="more" aria-label="More like this">More</button>
      <button type="button" data-act="less" aria-label="Less like this">Less</button>
      <button type="button" data-act="note" aria-label="Curator's note and source">Note</button>
      <button type="button" data-act="why" aria-label="Why this card">Why</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sheet-wrap" id="sheet-wrap" hidden>
      <div class="scrim" data-close></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <button type="button" class="close" data-close aria-label="Close">Close</button>
        <div id="sheet-body"></div>
      </div>
    </div>
    <div class="onboarding" id="onboarding" hidden></div>
    <noscript><p class="nojs">Commonplace needs JavaScript.</p></noscript>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
