name: Commonplace
options:
  bundleIdPrefix: com.johannbraun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: TLM2CHJBJF
    SWIFT_VERSION: "5.0"
targets:
  Commonplace:
    type: application
    platform: iOS
    sources:
      - path: Commonplace
      - path: ../index.html
        buildPhase: resources
      - path: ../styles.css
        buildPhase: resources
      - path: ../js
        type: folder
      - path: ../data
        type: folder
      - path: ../fonts
        type: folder
    info:
      path: Commonplace/Info.plist
      properties:
        CFBundleDisplayName: Commonplace
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        NSSpeechRecognitionUsageDescription: Commonplace turns the speech in films and recordings into captions. This happens on your device; the audio is not sent anywhere.
        NSSpeechRecognitionUsageDescription: Commonplace turns the speech in films and recordings into captions. This happens on your device; the audio is not sent anywhere.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannbraun.commonplace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
